name: ci

# Backend CI for the BakeLab fork, run by Gitea Actions on BB runners.
# The private Breadboard SDK is fetched from the internal mirror with the job token.

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trim' }}

permissions:
  contents: read

env:
  GOPRIVATE: github.com/BakeLab/breadboard
  GOTOOLCHAIN: local

jobs:
  lint-backend:
    runs-on: [bb, linux, x64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.gitea/actions/setup-arch
      - name: Use Breadboard mirror
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: &mirror |
          repo="${GITHUB_SERVER_URL}/BakeLab/inf_breadboard"
          git config --global url."${repo}".insteadOf https://github.com/BakeLab/breadboard
          git config --global http."${repo}".extraHeader "Authorization: Basic $(printf 'x-access-token:%s' "${GITEA_TOKEN:?}" | base64 -w0)"
      - run: make deps-backend deps-tools
      - run: TAGS="bindata" make generate-go lint-backend

  checks-backend:
    runs-on: [bb, linux, x64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.gitea/actions/setup-arch
      - name: Use Breadboard mirror
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: *mirror
      - run: make deps-backend deps-tools
      - run: make --always-make checks-backend
      - name: Test release publishing
        run: |
          sudo pacman -S --needed --noconfirm python jq
          python3 .gitea/scripts/test-publish-release.py

  backend:
    runs-on: [bb, linux, x64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.gitea/actions/setup-arch
      - name: Use Breadboard mirror
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: *mirror
      - run: make deps-backend generate-go
      - name: Check reachable vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          govulncheck ./...
      - name: Build Linux amd64 backend
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags '-s -w' -o gitea-linux-amd64 .

  test-unit:
    runs-on: [bb, linux, x64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.gitea/actions/setup-arch
      - name: Start test services
        run: docker compose -f .gitea/test-services.yml up -d --wait --wait-timeout 180 elasticsearch meilisearch redis minio azurite
      - name: Use Breadboard mirror
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: *mirror
      - name: Add hosts to /etc/hosts
        run: '[ -e "/.dockerenv" ] || [ -e "/run/.containerenv" ] || echo "127.0.0.1 minio devstoreaccount1.azurite.local elasticsearch meilisearch smtpimap" | sudo tee -a /etc/hosts'
      - run: make deps-backend
      - run: make generate-go
        env:
          TAGS: bindata
      - run: bash .gitea/scripts/test-as-user.sh make test-backend
        env:
          GOTEST_FLAGS: -race -timeout=40m
          TAGS: bindata
      - run: make test-check

      - name: Stop test services
        if: always()
        run: docker compose -f .gitea/test-services.yml down --volumes

  test-pgsql:
    runs-on: [bb, linux, x64]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.gitea/actions/setup-arch
      - name: Start test services
        run: docker compose -f .gitea/test-services.yml up -d --wait --wait-timeout 180 pgsql ldap minio
      - name: Use Breadboard mirror
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: *mirror
      - name: Add hosts to /etc/hosts
        run: '[ -e "/.dockerenv" ] || [ -e "/run/.containerenv" ] || echo "127.0.0.1 pgsql ldap minio" | sudo tee -a /etc/hosts'
      - run: make deps-backend
      - run: make backend
        env:
          TAGS: bindata
      - if: matrix.shard == 1
        run: GITEA_TEST_DATABASE=pgsql bash .gitea/scripts/test-as-user.sh make test-migration
      - run: GITEA_TEST_DATABASE=pgsql bash .gitea/scripts/test-as-user.sh make test-integration
        env:
          GOTEST_FLAGS: -race -timeout=70m
          TAGS: bindata
          TEST_LDAP: 1
          TEST_SHARD: ${{ matrix.shard }}
          TEST_TOTAL_SHARDS: 2

      - name: Stop test services
        if: always()
        run: docker compose -f .gitea/test-services.yml down --volumes

  test-e2e:
    runs-on: [bb, linux, x64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.gitea/actions/setup-arch
        with:
          frontend: 'true'
      - name: Start test services
        run: POSTGRES_DB=testgitea docker compose -f .gitea/test-services.yml up -d --wait --wait-timeout 180 pgsql
      - name: Use Breadboard mirror
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: *mirror
      - run: make deps-backend deps-frontend
      - run: CGO_ENABLED=0 TAGS=bindata make frontend backend
      - name: Run PostgreSQL E2E with Playwright
        timeout-minutes: 20
        run: |
          version=$(node -p 'require("@playwright/test/package.json").version')
          tar --exclude=.git --exclude=node_modules -cf - . | docker run -i --rm \
            --network host --shm-size=1g --user pwuser \
            -e PLAYWRIGHT_MODE=local -e EXECUTABLE=gitea -e CI=true \
            -e GITEA_TEST_E2E_DEBUG=1 -e TEST_PGSQL_HOST=localhost:5432 \
            "mcr.microsoft.com/playwright:v${version}-noble" bash -euo pipefail -c '
              cd "$(mktemp -d)"
              tar -xf -
              npm install --prefix "$PWD/.tools" --no-save "$(node -p "require(\"./package.json\").packageManager")"
              export PATH="$PWD/.tools/node_modules/.bin:$PATH"
              pnpm install --frozen-lockfile
              bash tools/test-e2e.sh
            '

      - name: Package tested Linux amd64 binary
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p dist/release
          cp gitea dist/release/gitea-linux-amd64
          (cd dist/release && sha256sum gitea-linux-amd64 > gitea-linux-amd64.sha256)
          BUILD_VERSION="$(./gitea --version)" node -e '
            require("node:fs").writeFileSync("dist/release/manifest.json", JSON.stringify({
              commit: process.env.BUILD_COMMIT,
              version: process.env.BUILD_VERSION,
              platform: "linux-amd64"
            }, null, 2) + "\n")'
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 7

      - name: Stop test services
        if: always()
        run: docker compose -f .gitea/test-services.yml down --volumes

  build-cli:
    runs-on: [bb, linux, x64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.gitea/actions/setup-arch
      - name: Test and build integrated CLI for release platforms
        run: |
          set -euo pipefail
          commit="$GITHUB_SHA"
          version="trim-${commit:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p dist/cli
          cd cli
          required=$(awk '$1 == "toolchain" {sub(/^go/, "", $2); print $2; exit}' go.mod)
          installed=$(go env GOVERSION)
          installed=${installed#go}
          test -n "$required"
          test "$(printf '%s\n' "$required" "$installed" | sort -V | head -n1)" = "$required"
          go test -race ./...
          go vet ./...
          for platform in linux-amd64 linux-arm64 darwin-arm64; do
            CGO_ENABLED=0 GOOS="${platform%-*}" GOARCH="${platform#*-}" go build -trimpath -buildvcs=false \
              -ldflags "-s -w -X gitea.dev/cli/internal/version.Version=${version}" \
              -o "../dist/cli/gt-${platform}" ./cmd/gt
          done
          cd ../dist/cli
          ./gt-linux-amd64 --version
          for binary in gt-*; do sha256sum "$binary" > "$binary.sha256"; done
          printf '{"repository":"BakeLab/gitea","path":"cli","commit":"%s","version":"%s","platforms":["linux-amd64","linux-arm64","darwin-arm64"]}\n' "$commit" "$version" > cli-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ github.sha }}
          path: dist/cli/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.ref == 'refs/heads/trim' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [lint-backend, checks-backend, backend, test-unit, test-pgsql, test-e2e, build-cli]
    runs-on: [bb, linux, x64]
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: sudo pacman -Syu --needed --noconfirm curl jq
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: dist/release
      - uses: actions/download-artifact@v4
        with:
          name: cli-${{ github.sha }}
          path: dist/release
      - run: bash .gitea/scripts/publish-release.sh dist/release --check
      - name: Publish tested trim binary
        env:
          RELEASE_TOKEN: ${{ github.token }}
        run: bash .gitea/scripts/publish-release.sh dist/release
