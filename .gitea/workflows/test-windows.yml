name: Windows

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

env:
  # an empty config, so that pulls are anonymous rather than with the host's stale credentials
  DOCKER_CONFIG: /tmp/docker-noauth

jobs:
  test:
    name: Unit Test On Windows
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: 'go.mod'
          check-latest: true
      - name: Prepare anonymous docker config
        run: mkdir -p "$DOCKER_CONFIG" && echo '{}' > "$DOCKER_CONFIG/config.json"
      - name: Unit test on Windows
        run: make test-windows
