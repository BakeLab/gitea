name: gitea-cli
base: core22
summary: Gitea CLI Tool
description: A command line tool to interact with Gitea servers
grade: stable
confinement: strict

architectures:
  - build-on: amd64
  - build-on: arm64
  - build-on: armhf

adopt-info: gt

apps:
  gt:
    command: gt
    plugs: [network, network-bind, removable-media, password-manager-service]

parts:
  gt:
    plugin: make
    source: https://gitea.com/gitea/cli.git
    stage-packages: [ git,  openssh-client ]
    build-packages: [ git, build-essential]
    build-snaps: [ go/1.27/stable ]
    build-environment:
      - LDFLAGS: ""
    override-pull: |
      craftctl default

      git config --global --add safe.directory /root/parts/gt/src
      last_committed_tag="$(git for-each-ref --sort=creatordate --format '%(refname:short)' refs/tags | tail -n 1)"
      last_released_tag="$(snap info gitea-cli | awk '$1 == "latest/candidate:" { print $2 }')"
      # If the latest tag from the upstream project has not been released to
      # stable, build that tag instead of main.
      if [ "${last_committed_tag}" != "${last_released_tag}" ]; then
        git fetch
        git checkout "${last_committed_tag}"
      fi

      version="$(git describe --tags --always | sed -e 's/-/+git/;y/-/./')"
      [ -n "$(echo $version | grep "+git")" ] && grade=devel || grade=stable
      craftctl set version="$version"
      craftctl set grade="$grade"

    override-build: |
      set -x
      go mod vendor
      make build
      install -D gt "${SNAPCRAFT_PART_INSTALL}/gt"
